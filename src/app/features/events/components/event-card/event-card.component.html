<div class="card h-100 shadow border-0">
  <img
    [src]="event?.imageUrl"
    class="card-img-top img-fluid"
    style="height: 200px; object-fit: cover"
    alt="event photo"
  />

  <div class="card-body d-flex flex-column">
    <h5 class="card-title text-dark fs-6 mb-2" appHighlight>{{ event?.title | uppercase }}</h5>

    <div class="mb-2">
      <span class="badge bg-danger me-2">{{ event?.place }}</span>
      <span class="text-muted small">{{ event?.date | date:'mediumDate' }}</span>
    </div>

    <p class="card-text text-secondary small flex-grow-1">{{ event?.description }}</p>

    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold text-success fs-5">{{ event?.price | currency:'TND' }}</span>
        <span class="badge bg-info text-dark">Places: {{ event?.nbPlaces }}</span>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted small">Likes: {{ event?.nbLikes }}</span>
      </div>

      <div class="d-flex gap-2">
        <button
          class="btn btn-sm btn-outline-primary flex-fill"
          (click)="likeEvent()"
          [disabled]="dateExpire() || event?.nbPlaces === 0">
          👍 Like
        </button>

        <button
          class="btn btn-sm btn-success flex-fill"
          (click)="buyEvent()"
          [disabled]="dateExpire() || event?.nbPlaces === 0">
          Buy ticket
        </button>
        <button class="btn btn-sm btn-primary flex-fill" [routerLink]="['participer', event?.id ,event?.price]" [disabled]="event?.nbPlaces === 0">
          participate
        </button>
        <a
          [routerLink]="['/events', event?.id]"
          class="btn btn-sm btn-info flex-fill">
          Voir détails
        </a>
      </div>
    </div>
  </div>
</div>

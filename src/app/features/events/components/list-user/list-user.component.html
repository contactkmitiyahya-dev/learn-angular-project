<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Liste des Utilisateurs</h2>
    <button (click)="calculateUsers()" class="btn btn-success">
      <i class="bi bi-calculator me-2"></i>Calculer
    </button>
  </div>

  <div class="row">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let user of users">
      <div class="card h-100 shadow-sm">
        <div class="card-img-container text-center p-3">
          <img [src]="user.picture" class="card-img-top rounded-circle"
              [alt]="user.firstName" style="width: 120px; height: 120px; object-fit: cover;">
        </div>
        <div class="card-body text-center">
          <h5 class="card-title text-primary">{{ user.firstName }} {{ user.lastName }}</h5>
          <p class="card-text text-muted mb-2">
            <i class="bi bi-briefcase me-2"></i>{{ user.profession }}
          </p>
          <div class="user-details">
            <p class="mb-1">
              <i class="bi bi-envelope me-2"></i>
              <small>{{ user.email }}</small>
            </p>
            <p class="mb-1">
              <i class="bi bi-person-badge me-2"></i>
              <span class="badge"
                    [ngClass]="{
                      'bg-danger': user.accountCategory === 'Admin',
                      'bg-primary': user.accountCategory === 'Customer',
                      'bg-warning': user.accountCategory === 'Golden',
                      'bg-secondary': user.accountCategory === 'Blocked Account'
                    }">
                {{ user.accountCategory }}
              </span>
            </p>
            <p class="mb-0">
              <i class="bi bi-calendar me-2"></i>
              <small>{{ user.birthDate }}</small>
            </p>
          </div>
        </div>
        <div class="card-footer bg-transparent text-center">
          <small class="text-muted">ID: {{ user.id }}</small>
        </div>
      </div>
    </div>
  </div>
</div>
